
name: Build InfinityCalculator APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Checkout Repository
        uses: actions/checkout@v4

      # نصب Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نصب Gradle بدون نیاز به gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # نمایش ساختار پروژه برای عیب‌یابی
      - name: Check Project Structure
        run: |
          echo "Project files:"
          ls -la
          echo "App module:"
          ls -la app
          echo "Gradle version:"
          gradle --version

      # ساخت APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # بررسی وجود APK
      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK file not found!"
            find . -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh app/build/outputs/apk/debug/

      # ذخیره APK برای دانلود
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
